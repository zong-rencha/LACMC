name: Copy existing evaluation release once
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: copy-evaluation-v1.3-once
  cancel-in-progress: false
jobs:
  copy:
    if: github.repository == 'zong-rencha/LACMC' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Download and verify the eight original public assets
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, hashlib, pathlib, time, urllib.request
          expected = {"models.tar.gz":"0a5247044f185198e855e158cb92c93a5c6db825cb98962640c237aa1f37b123","maps.tar.gz":"31e754dd553fb57a2b1da0705f4ae0ac2c050300bbdcd3aa148574d61a78c406","cmac-dtr-1.3.tar.part-003":"db978a7f8110cfb4d2243d1a1b1ee518688382224ec1e9b5bdaf478f5f21e8d0","cmac-dtr-1.3.tar.part-001":"feb6fe1ce1d5710ace60637902a5e26a5b1122eed43fa4ba7186e7e47d66bcd2","cmac-dtr-1.3.tar.part-004":"dadbf6267a07935272628fbe140013bbadbd0407a649b33687258e536bb2e4f3","cmac-dtr-1.3.tar.part-002":"a407ad538591bec749f4c8a39ff42fb26de262b72d167b1fc126112b08b3c6f4","SHA256SUMS":"3c1c02f506c9c07c8dd7f98749f02316cb508c02e595381df6ac70ba2a81ecf4","release-manifest.json":"7129b9d6c2131b91ecbbf17f0b8bde93f2c093381658fd90427a1bb5a3998ed1"}
          root = pathlib.Path("assets")
          root.mkdir(exist_ok=True)
          def fetch(item):
              name, wanted = item
              for attempt in range(4):
                  try:
                      digest = hashlib.sha256()
                      request = urllib.request.Request("https://github.com/zong-rencha/CMAC-DTR/releases/download/v1.3/" + name, headers={"User-Agent": "LACMC-release-migration"})
                      with urllib.request.urlopen(request, timeout=180) as response, (root / name).open("wb") as stream:
                          while True:
                              chunk = response.read(4 * 1024 * 1024)
                              if not chunk:
                                  break
                              stream.write(chunk)
                              digest.update(chunk)
                      if digest.hexdigest() != wanted:
                          raise RuntimeError("SHA256 mismatch: " + name)
                      print("Verified source:", name, flush=True)
                      return
                  except Exception:
                      if attempt == 3:
                          raise
                      time.sleep(3 * (attempt + 1))
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              list(pool.map(fetch, expected.items()))
          print("All eight original assets verified.", flush=True)
          PY
      - name: Upload only to the existing LACMC draft and verify hashes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess, time
          expected = {"models.tar.gz":"0a5247044f185198e855e158cb92c93a5c6db825cb98962640c237aa1f37b123","maps.tar.gz":"31e754dd553fb57a2b1da0705f4ae0ac2c050300bbdcd3aa148574d61a78c406","cmac-dtr-1.3.tar.part-003":"db978a7f8110cfb4d2243d1a1b1ee518688382224ec1e9b5bdaf478f5f21e8d0","cmac-dtr-1.3.tar.part-001":"feb6fe1ce1d5710ace60637902a5e26a5b1122eed43fa4ba7186e7e47d66bcd2","cmac-dtr-1.3.tar.part-004":"dadbf6267a07935272628fbe140013bbadbd0407a649b33687258e536bb2e4f3","cmac-dtr-1.3.tar.part-002":"a407ad538591bec749f4c8a39ff42fb26de262b72d167b1fc126112b08b3c6f4","SHA256SUMS":"3c1c02f506c9c07c8dd7f98749f02316cb508c02e595381df6ac70ba2a81ecf4","release-manifest.json":"7129b9d6c2131b91ecbbf17f0b8bde93f2c093381658fd90427a1bb5a3998ed1"}
          repo = "zong-rencha/LACMC"
          release_id = 426209298
          def snapshot():
              result = subprocess.run(["gh", "api", "repos/" + repo + "/releases/" + str(release_id)], check=True, capture_output=True, text=True)
              release = json.loads(result.stdout)
              assert release["draft"] and release["tag_name"] == "v1.3"
              assert release["target_commitish"] == "f33614b9fc9ff73694e00a1cf57657e3e3902fb5"
              return release
          for name, wanted in expected.items():
              for attempt in range(4):
                  release = snapshot()
                  existing = next((a for a in release["assets"] if a["name"] == name), None)
                  if existing:
                      assert existing["digest"] == "sha256:" + wanted, name
                      print("Verified destination:", name, flush=True)
                      break
                  result = subprocess.run(["gh", "release", "upload", "v1.3", str(pathlib.Path("assets") / name), "--repo", repo])
                  if attempt == 3 and result.returncode:
                      raise RuntimeError("Upload failed: " + name)
                  time.sleep(2)
              else:
                  raise RuntimeError("Upload retries exhausted: " + name)
          release = snapshot()
          assert len(release["assets"]) == len(expected)
          for asset in release["assets"]:
              assert asset["digest"] == "sha256:" + expected[asset["name"]], asset["name"]
          print("Migration verified: all eight draft release assets match the original SHA256 values.", flush=True)
          PY
